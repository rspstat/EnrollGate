name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests (H2 in-memory DB, no external infra required)
        run: ./gradlew test --no-daemon

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: code/backend/**/build/test-results/test/*.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f code/backend/app/Dockerfile -t enrollgate-app:ci code/backend

      - name: Build ai-model image
        run: docker build -t enrollgate-ai-model:ci code/ai-model
