spring:
  application:
    name: enrollgate

  datasource:
    url: jdbc:postgresql://localhost:5432/enrollgate
    username: enrollgate
    password: enrollgate

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
  access-token-expiration-ms: 3600000
